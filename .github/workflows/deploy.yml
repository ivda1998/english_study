name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # 콘텐츠 검증 → 타입 검사 → 단위 테스트 → 빌드 순으로 막는다.
      - run: npm test
      - run: npm run build

      # Pages는 저장소 Settings → Pages → Source 를 "GitHub Actions" 로 한 번 바꿔야 켜진다.
      # enablement: true 로 워크플로가 대신 켜게 해봤지만 GITHUB_TOKEN 권한으로는 안 된다
      # ("Create Pages site failed: Resource not accessible by integration").
      # 이미 켜져 있으면 이 옵션은 아무 일도 하지 않으므로, 저장소를 새로 팔 때를 위해 남겨 둔다.
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
